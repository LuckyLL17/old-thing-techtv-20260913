services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: upcycle-hub:latest
    container_name: upcycle-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      UPCYCLE_SERVER_HOST: 0.0.0.0
      UPCYCLE_SERVER_PORT: 8080
      UPCYCLE_SERVER_MODE: release
      UPCYCLE_DB_DRIVER: sqlite
      UPCYCLE_DB_DSN: /data/db/upcycle.db
      UPCYCLE_JWT_SECRET: ${UPCYCLE_JWT_SECRET:-change-me-to-a-long-random-string-please}
      UPCYCLE_JWT_EXPIREHOUR: 24
      UPCYCLE_LOG_LEVEL: info
      UPCYCLE_UPLOAD_DIR: /data/uploads
      UPCYCLE_UPLOAD_MAXSIZE: 10485760
      UPCYCLE_UPLOAD_IMAGEMAX: 1920
      UPCYCLE_RATE_ENABLE: "true"
      UPCYCLE_RATE_LIMIT: 300
      UPCYCLE_RATE_WINDOW: 60
    volumes:
      - upcycle-db:/data/db
      - upcycle-uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:8080/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  upcycle-db:
    driver: local
  upcycle-uploads:
    driver: local
